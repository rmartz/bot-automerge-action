name: 'bot-automerge'
description: 'Enable GitHub-native auto-merge for trustworthy bot PRs (Dependabot patch/minor bumps, release-please release PRs) via the @rmartz/bot-automerge CLI.'
author: 'rmartz'

branding:
  icon: 'git-merge'
  color: 'green'

# A composite action that wraps the @rmartz/bot-automerge CLI. The consuming repo's
# caller job runs on pull_request_target and grants contents:write +
# pull-requests:write; this action classifies the PR and, when it is a trusted bot
# bump, enables GitHub-native auto-merge. The CLI
# version is the one pinned in this action's package-lock.json (bumped by Dependabot
# + released as a new action version), so a given action ref enforces a reproducible
# eligibility policy. See docs/design/integration-contract.md.
#
# NOTE: a composite action CANNOT use `secrets: inherit` (that is a
# reusable-workflow-only feature), so a real-actor PAT is passed as the EXPLICIT
# `token` input, not inherited — see docs/consuming.md.
#
# Every step resolves its token as `inputs.token || github.token`: an unset secret
# passed as `token: ${{ secrets.X }}` arrives as an empty string, which overrides
# the input default rather than falling back to it. Resolving per step means
# callers never need their own `|| github.token`.

inputs:
  pr:
    description: >-
      PR number to classify and enable auto-merge for. Pass the pull_request
      event's number from your caller (github.event.pull_request.number) — see
      docs/consuming.md for the caller snippet. This text must not contain a
      template expression: an action manifest validates expressions in input
      metadata against a context where github is unavailable, so one here fails the
      action load.
    required: true
  token:
    description: >-
      Token used by every step: the fork check, the Dependabot metadata fetch, and
      enabling auto-merge on both the Dependabot and release-please paths. Pass a
      real-actor PAT so the merge fires the consumer's push workflows (CI, release
      CD) — GitHub runs no workflows for a merge enabled with the workflow
      GITHUB_TOKEN. Empty or unset (an unset secret) falls back to the workflow
      GITHUB_TOKEN, which needs contents:write + pull-requests:write on the job.
    required: false
    default: ${{ github.token }}
  release-please-token:
    description: >-
      DEPRECATED — pass the PAT as `token` instead; this input will be removed in
      the next major. When set, it still overrides `token` on the release-please /
      other-bot path only, and the run logs a deprecation warning.
    required: false
    default: ''
  update-type:
    description: >-
      Optional override for the Dependabot semver update-type
      (version-update:semver-patch | :semver-minor | :semver-major). Empty (the
      default) derives it via dependabot/fetch-metadata for dependabot[bot] PRs.
      Ignored on non-Dependabot PRs.
    required: false
    default: ''
  node-version:
    description: 'Node.js version to run the CLI under.'
    required: false
    default: '22'

runs:
  using: composite
  steps:
    # Never act on a fork PR (GHSA-39fm-72q5-676g). A fork picks its own branch
    # name, so it can pose as a release-please PR, and the caller's
    # pull_request_target job holds a write token. Genuine Dependabot and
    # release-please branches always live in the base repository. This runs before
    # anything else, reads the PR over the API (so it covers an explicit `pr` input
    # too), and gates every later step, whatever CLI version is pinned. A missing
    # field or a deleted head repository counts as a fork; an unreadable PR fails.
    - name: Reject fork PRs
      id: origin
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
        PR_NUMBER: ${{ inputs.pr }}
        REPO: ${{ github.repository }}
      run: |
        same_repo=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" \
          --json isCrossRepository,headRepository \
          --jq '.isCrossRepository == false and .headRepository != null')
        if [ "${same_repo}" = "true" ]; then
          echo "trusted=true" >> "${GITHUB_OUTPUT}"
        else
          echo "#${PR_NUMBER}: PR is from a fork (cross-repository) — never eligible; skipping"
          echo "trusted=false" >> "${GITHUB_OUTPUT}"
        fi
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: steps.origin.outputs.trusted == 'true'
      with:
        node-version: ${{ inputs.node-version }}
    # Install the pinned CLI into this action's own directory — $GITHUB_ACTION_PATH
    # holds this action's package.json, lockfile, and .npmrc (which pins the
    # @rmartz scope to npmjs) — not the consumer workspace. The package is public
    # on npmjs, so the install needs no token.
    - name: Install pinned @rmartz/bot-automerge
      if: steps.origin.outputs.trusted == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    # A Dependabot PR carries a semver update-type; fetch it (unless overridden via
    # the update-type input) and pass it so the CLI enables auto-merge only on
    # patch/minor. The guard keys off the PR author, robust across
    # opened/synchronize/labeled — unlike github.actor, which can be a human who
    # relabeled the PR.
    - name: Fetch Dependabot metadata
      id: metadata
      if: steps.origin.outputs.trusted == 'true' && github.event.pull_request.user.login == 'dependabot[bot]' && inputs.update-type == ''
      uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      with:
        github-token: ${{ inputs.token != '' && inputs.token || github.token }}
    - name: Enable auto-merge (Dependabot)
      if: steps.origin.outputs.trusted == 'true' && github.event.pull_request.user.login == 'dependabot[bot]'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
        PR_NUMBER: ${{ inputs.pr }}
        REPO: ${{ github.repository }}
        UPDATE_TYPE: ${{ inputs.update-type != '' && inputs.update-type || steps.metadata.outputs.update-type }}
      run: >-
        "${GITHUB_ACTION_PATH}/node_modules/.bin/bot-automerge" enable
        --pr "${PR_NUMBER}" --repo "${REPO}" --update-type "${UPDATE_TYPE}"
    # Any other author (release-please or another bot) — the CLI detects
    # release-please itself and no-ops on anything it does not trust. No update-type
    # is passed on this path. The deprecated `release-please-token`, when set, still
    # overrides `token` here for callers that have not moved their PAT yet.
    - name: Warn on deprecated release-please-token
      if: inputs.release-please-token != ''
      shell: bash
      run: >-
        echo "::warning title=bot-automerge-action::The release-please-token input is
        deprecated and will be removed in the next major. Pass the PAT as token
        instead; it now governs both the Dependabot and release-please paths."
    - name: Enable auto-merge (release-please / other bot)
      if: steps.origin.outputs.trusted == 'true' && github.event.pull_request.user.login != 'dependabot[bot]'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.release-please-token != '' && inputs.release-please-token || (inputs.token != '' && inputs.token || github.token) }}
        PR_NUMBER: ${{ inputs.pr }}
        REPO: ${{ github.repository }}
      run: >-
        "${GITHUB_ACTION_PATH}/node_modules/.bin/bot-automerge" enable
        --pr "${PR_NUMBER}" --repo "${REPO}"
