version: 2

# @rmartz/bot-automerge is public on npmjs, so Dependabot needs no registry block or
# DEPENDABOT_PACKAGES_TOKEN secret to see new CLI versions.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # First-party `rmartz/*` actions and reusable workflows are exempt from the
      # default release cooldown (see the npm entry below); third-party actions
      # keep it.
      # Explicit, so declaring the block can't change the third-party default.
      default-days: 3
      exclude:
        - 'rmartz/*'
    commit-message:
      # Action bumps only touch this repo's own CI workflows, not the shipped
      # composite Action, so they must not cut a release: `chore` → no release.
      prefix: chore
      include: scope
    groups:
      # Action patch and minor bumps batch into one PR; every major opens as its
      # own PR, so a major held for human review can't hold the routine bumps
      # back from auto-merge.
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    # Daily, not weekly: this is the hop that turns a new @rmartz/bot-automerge
    # release into a new Action release. Stacked on the consumers' own weekly
    # github-actions pin bump, a weekly interval here could delay a CLI fix ~2
    # weeks before it reaches the fleet; daily cuts this repo's share to ≤1 day.
    # That bound holds only because the CLI is exempt from the cooldown below.
    schedule:
      interval: daily
    commit-message:
      # Production deps ship inside the released Action, so their bump must cut a
      # release: prefix `fix` (→ patch via semantic-release's conventionalcommits
      # preset). This is only the *initial* title — the dependabot-release-type
      # workflow rewrites it to mirror the CLI's semver bump (minor → feat(deps),
      # major → feat(deps)! + breaking-change label) so the Action release matches.
      # Dev deps never reach the shipped artifact, so `prefix-development: chore`
      # keeps them release-less. (Codified in rmartz/ai#82.)
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Prettier isolated so a reformatting bump can't hide in a catch-all.
      prettier:
        patterns:
          - 'prettier'
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - 'prettier'
        update-types:
          - minor
          - patch
      # @rmartz/bot-automerge is the only production dep; its patch/minor bump is
      # what bot-automerge auto-merges and, titled `fix(deps)`, maps to a patch
      # release, so the bump cuts a new action release. A major bump falls out to
      # its own PR (not auto-merged) for a human to review.
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    cooldown:
      # Since 2026-07-14 Dependabot waits 3 days after a release before proposing
      # it. First-party `@rmartz/*` packages (the @rmartz/bot-automerge CLI among
      # them) are published from our own repos with provenance, so the wait buys no
      # supply-chain safety and just holds their fixes back. Exempting them lets a
      # new CLI version arrive on the next daily run. Every third-party dependency
      # keeps the default cooldown.
      # Explicit, so declaring the block can't change the third-party default.
      default-days: 3
      exclude:
        - '@rmartz/*'
