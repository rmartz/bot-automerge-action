name: bot-automerge

# This repo dogfoods bot-automerge on itself: it enables GitHub-native auto-merge
# for its own trustworthy bot PRs — Dependabot patch/minor bumps (including the
# @rmartz/bot-automerge CLI bump that drives our own releases) and release PRs —
# gated on the required checks (including merge-safety), so nothing merges ahead of
# CI.
#
# This calls the LOCAL action (`uses: ./`) — the exact shape every consumer uses
# (see docs/consuming.md). A composite action cannot declare its own triggers, hold
# write scopes, or use `secrets: inherit`, so this caller carries the trigger,
# grants the write permissions, and passes the release-please PAT as an explicit
# input (`release-please-token`). This repo publishes via semantic-release, not
# release-please, so its own bot PRs take the Dependabot path; the release-please
# input is passed for parity with the consumer contract and falls back to the job
# token when the secret is unset.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write # enable GitHub-native auto-merge on the PR
  pull-requests: write # read PR metadata + turn on auto-merge
  packages: read # install the @rmartz/bot-automerge CLI from GitHub Packages

jobs:
  bot-automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          pr: ${{ github.event.pull_request.number }}
          release-please-token: ${{ secrets.RELEASE_PLEASE_PAT }}
