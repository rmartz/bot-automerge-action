name: bot-automerge

# This repo dogfoods bot-automerge on itself: it enables GitHub-native auto-merge
# for its own trustworthy bot PRs — Dependabot patch/minor bumps (including the
# @rmartz/bot-automerge CLI bump that drives our own releases) and release PRs —
# gated on the required checks (including merge-safety), so nothing merges ahead of
# CI.
#
# This calls the LOCAL action (`uses: ./`) — Shape B in docs/consuming.md, the shape
# a consumer uses when it owns the job. Consumers are pointed at Shape A (the
# reusable-workflow wrapper) by default; see AGENTS.md "Self-dogfooding" for why this
# repo deliberately dogfoods the Action directly, and what that leaves uncovered.
# A composite action cannot declare its own triggers, hold
# write scopes, or use `secrets: inherit`, so this caller carries the trigger,
# grants the write permissions, and passes the PAT as the explicit `token` input —
# the single token every step uses, on both the Dependabot and release-please paths.
# A real-actor PAT matters here: GitHub runs no workflows for a merge enabled with
# GITHUB_TOKEN, so without it a merged bot PR would not fire the release workflow.
# It takes BOT_AUTOMERGE_TOKEN, else RELEASE_PLEASE_PAT, and the action falls back
# to the job token when both secrets are unset. (The PAT must also be a Dependabot
# secret, since Dependabot-triggered runs cannot read Actions secrets.)

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write # enable GitHub-native auto-merge on the PR
  pull-requests: write # read PR metadata + turn on auto-merge

jobs:
  bot-automerge:
    # Skip the job outright on PRs the CLI could never trust, so a human PR shows a
    # free `skipped` instead of checking out and installing the CLI just to no-op.
    # A fork PR is always skipped (GHSA-39fm-72q5-676g): a fork picks its own
    # branch name, so it could pose as release-please.
    # The three bot conditions mirror the CLI's own detectBotPrType exactly —
    # Dependabot by author, release-please by branch prefix only (the pending label
    # is not a signal; see GHSA-4f7f-7fcp-gcm6) — so nothing eligible is skipped. Note release-please's author is NOT reliably a
    # [bot] account: run under a PAT, its release PR is authored by that real user,
    # which is why this keys off the branch rather than the author alone.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.pull_request.user.login == 'dependabot[bot]'
      || startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          pr: ${{ github.event.pull_request.number }}
          token: ${{ secrets.BOT_AUTOMERGE_TOKEN || secrets.RELEASE_PLEASE_PAT }}
