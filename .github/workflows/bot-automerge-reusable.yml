name: bot-automerge (reusable)

# A thin JOB-LEVEL wrapper around this repo's composite Action, offered alongside
# it — not instead of it. Both shapes enforce the same eligibility policy from the
# same pinned CLI; they differ only in what the consumer owns.
#
#   jobs:
#     bot-automerge:
#       uses: rmartz/bot-automerge-action/.github/workflows/bot-automerge-reusable.yml@<sha> # vX.Y.Z
#       secrets: inherit
#
# Why this exists: a composite Action is a STEP, so it cannot skip its caller's
# job. Getting a `skipped` conclusion on a PR that can never qualify therefore
# requires a job-level `if:`, which in the Action shape has to be copy-pasted into
# every consuming repo — eleven of them, each a private copy of the CLI's
# classifier that nothing bumps when the classifier changes. Here the guard lives
# once, next to the logic it mirrors, and ships with the pin the consumer already
# updates.
#
# `uses: $/` resolves to THIS repository at the exact commit the consumer pinned,
# with no checkout, so the wrapper and the Action can never drift apart and there
# is no second pin to maintain. It is also the only form that works here: a `./`
# ref inside a reusable workflow resolves against the CALLER's workspace, where
# this action does not exist. See
# https://github.blog/changelog/2026-07-30-reference-same-repository-actions-with-self-repository-syntax/
#
# A called workflow runs with the INTERSECTION of the scopes it declares and the
# scopes its caller grants, so the caller must grant both below or the run fails
# at startup validation. Unlike the Action shape, `secrets: inherit` works here, so
# the merge credential no longer has to be threaded by hand — the omission that
# silently skips the consumer's push workflows (CI, release CD) after a merge.
#
# The token fed to the Action's single `token` input (both the Dependabot and
# release-please paths) is resolved in this order:
#   1. MERGE_BOT_CLIENT_ID + MERGE_BOT_PRIVATE_KEY both set → a short-lived
#      installation token for that GitHub App, minted per run. Recommended: the App
#      has its own rate-limit pool (a PAT shares its user's pool with every other
#      token that user holds) and merges are attributed to the bot, while
#      App-authored events still fire the consumer's push workflows.
#   2. Otherwise the real-actor PAT in BOT_AUTOMERGE_TOKEN, falling back to the
#      legacy RELEASE_PLEASE_PAT.
#   3. With none of these set the Action falls back to the job's GITHUB_TOKEN.

on:
  workflow_call:
    inputs:
      pr:
        description: >-
          PR number to classify. Defaults to the caller's own pull_request event,
          so a pull_request_target caller passes nothing. Supply it only when
          calling from an event that carries no PR (e.g. workflow_dispatch).
        type: string
        required: false
        default: ''
      update-type:
        description: >-
          Optional override for the Dependabot semver update-type. Empty (the
          default) derives it via dependabot/fetch-metadata. Ignored on
          non-Dependabot PRs.
        type: string
        required: false
        default: ''
      node-version:
        description: Node.js version to run the CLI under.
        type: string
        required: false
        default: '22'
    secrets:
      MERGE_BOT_CLIENT_ID:
        description: >-
          Client ID of a GitHub App installed on the repo with contents:write +
          pull-requests:write. With MERGE_BOT_PRIVATE_KEY, the workflow mints an
          installation token and uses it for every step instead of any PAT. For
          Dependabot-triggered runs it must also exist as a Dependabot secret.
          Optional; ignored unless MERGE_BOT_PRIVATE_KEY is also set.
        required: false
      MERGE_BOT_PRIVATE_KEY:
        description: >-
          Private key (PEM) of the GitHub App named by MERGE_BOT_CLIENT_ID. For
          Dependabot-triggered runs it must also exist as a Dependabot secret.
          Optional; ignored unless MERGE_BOT_CLIENT_ID is also set.
        required: false
      BOT_AUTOMERGE_TOKEN:
        description: >-
          Real-actor PAT used for every step when no GitHub App is configured, so a
          merge fires the consumer's push workflows. For Dependabot-triggered runs
          it must also exist as a Dependabot secret. Optional; falls back to
          RELEASE_PLEASE_PAT, then the job's GITHUB_TOKEN.
        required: false
      RELEASE_PLEASE_PAT:
        description: >-
          Legacy name for BOT_AUTOMERGE_TOKEN, still accepted for compatibility.
          Used only when BOT_AUTOMERGE_TOKEN is unset.
        required: false

permissions:
  contents: write # enable GitHub-native auto-merge on the PR
  pull-requests: write # read PR metadata + turn on auto-merge

# No `concurrency:` group, deliberately. GitHub permits only one PENDING run per
# group and cancels any it supersedes, so a group turns a burst of
# pull_request_target events (opening a PR and labelling it fires one each) into
# `cancelled` check-runs — a conclusion merge-gating tools read as failure and
# which is indistinguishable from a timeout. That, not the reusable-workflow shape
# itself, is what made the predecessor noisy. See docs/consuming.md.

jobs:
  enable:
    name: Enable auto-merge for an eligible bot PR
    # Skip outright on PRs the CLI could never trust, so a human PR resolves as a
    # free `skipped` instead of installing the CLI just to no-op. The conditions
    # mirror the CLI's own detectBotPrType exactly — Dependabot by author,
    # release-please by branch prefix only — so nothing eligible is skipped. The
    # `autorelease: pending` label is NOT a signal (GHSA-4f7f-7fcp-gcm6): anyone with
    # triage access can apply it to any PR.
    #
    # Deliberately NOT an author test. release-please authors its PR as a [bot]
    # account only under the default GITHUB_TOKEN; run under a PAT it is authored
    # by that real user, so `endsWith(login, '[bot]')` would skip exactly the
    # release PRs a consumer wanted merged.
    #
    # A fork PR is always skipped (GHSA-39fm-72q5-676g): a fork picks its own
    # branch name, so it can pose as release-please. The Action rejects fork PRs
    # too; this skips them before a runner starts.
    #
    # An explicit `pr` input bypasses the bot conditions: the caller has named a PR
    # deliberately, and the Action still rejects a fork and the CLI still no-ops if
    # untrusted.
    if: >-
      (github.event.pull_request == null
      || github.event.pull_request.head.repo.full_name == github.repository)
      && (inputs.pr != ''
      || github.event.pull_request.user.login == 'dependabot[bot]'
      || startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The `secrets` context is not available in a step `if:`, so whether a GitHub
    # App is configured is computed here, at job level where it is, and the
    # token-minting step gates on this boolean ('true' / 'false') instead. Only the
    # boolean is exposed, never the secret values.
    env:
      HAS_MERGE_BOT_APP: ${{ secrets.MERGE_BOT_CLIENT_ID != '' && secrets.MERGE_BOT_PRIVATE_KEY != '' }}
    # No checkout: `$/` is resolved by the runner, and the Action installs its
    # pinned CLI into its own directory and reaches the PR over the API — it never
    # reads the consumer's tree.
    steps:
      # Mint a short-lived installation token for the consumer's GitHub App, scoped
      # to the calling repository, when both App secrets are set. With either one
      # unset the step is skipped, its output is empty, and `token` below falls
      # through to the PAT exactly as before this step existed.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.HAS_MERGE_BOT_APP == 'true'
        with:
          client-id: ${{ secrets.MERGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_BOT_PRIVATE_KEY }}
      - uses: $/
        with:
          pr: ${{ inputs.pr != '' && inputs.pr || github.event.pull_request.number }}
          token: ${{ steps.app-token.outputs.token || secrets.BOT_AUTOMERGE_TOKEN || secrets.RELEASE_PLEASE_PAT }}
          update-type: ${{ inputs.update-type }}
          node-version: ${{ inputs.node-version }}
