name: flag-breaking-dep

# Auto-flags a Dependabot **major** bump of the wrapped @rmartz/bot-automerge CLI as
# a breaking Action release. A CLI major is the strongest signal of consumer-facing
# breakage, and the versioning policy defaults to propagating it as an Action major
# (docs/design/versioning.md). This encodes that default so a reviewer cannot merge
# the PR as a silent patch by forgetting to escalate it:
#
#   * adds the `breaking change` label, and
#   * rewrites the title `fix(deps):` -> `fix(deps)!:` so semantic-release cuts a
#     major from the squash-merge.
#
# The human override is intact: a reviewer who confirms the CLI major changes nothing
# visible to Action consumers removes the `!` and the label before merging to cut a
# patch instead. The workflow fires only on `opened`/`reopened` (never `synchronize`),
# so a later Dependabot rebase does not re-apply the marker over that decision.
#
# Editing a bot PR needs base-context write, so — like bot-automerge.yml — this runs
# on `pull_request_target` with `pull-requests: write`. Detection uses
# dependabot/fetch-metadata's structured outputs, never title parsing, and is gated
# to the npm ecosystem + the exact wrapped package so a major bump of any other
# dependency (a github-actions or dev-dep major) cannot false-positive.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write # rewrite the PR title + add the label

env:
  # The one production dependency whose major bump is a breaking Action release.
  # (This is the per-repo value; repo-hygiene-action's is @rmartz/repo-hygiene.)
  TARGET_DEP: '@rmartz/bot-automerge'

jobs:
  flag:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Flag major bump of the wrapped CLI as a breaking release
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-major' &&
          steps.meta.outputs.package-ecosystem == 'npm' &&
          contains(steps.meta.outputs.dependency-names, env.TARGET_DEP) &&
          !contains(github.event.pull_request.title, '!:')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          new_title="${TITLE/: /!: }"
          printf '%s\n' \
            'Auto-flagged as a **major** (breaking) Action release: this PR bumps the wrapped `@rmartz/bot-automerge` CLI across a major version.' \
            '' \
            'A CLI major is the strongest signal of consumer-facing breakage, so per the [versioning policy](https://github.com/rmartz/bot-automerge-action/blob/main/docs/design/versioning.md) the Action release defaults to a **major**. I added the `breaking change` label and the `!` marker to the title so the squash-merge cuts a major.' \
            '' \
            'If you confirm this CLI major changes nothing visible to Action consumers, remove the `!` from the title and the `breaking change` label before merging to cut a patch instead — and note that reasoning here.' \
            '' \
            '---' \
            '*Posted automatically by the flag-breaking-dep workflow*' > "$RUNNER_TEMP/comment.md"
          gh pr edit "$PR" --title "$new_title" --add-label "breaking change"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
